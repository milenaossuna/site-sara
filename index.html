:root {
  --bg-color: #FAFAFA;
  --bg-header: #F1F4F2;
  --bg-footer: #EAEFEA;
  --text-main: #2A2C2B;
  --text-light: #5A605D;
  --primary: #4A6E58;
  --primary-hover: #3A5645;
  --white: #FFFFFF;
  --whatsapp: #25D366;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

html {
  scroll-behavior: smooth;
}

/* CLASSE DE ANIMAÇÃO (SCROLL REVEAL) */
.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
}

.reveal.active {
  opacity: 1;
  transform: translateY(0);
}

/* MENU DE NAVEGAÇÃO */
.menu {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 5%;
  z-index: 1000;
  transition: all 0.3s ease;
  background: transparent;
}

.menu.scrolled {
  background: var(--white);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
  padding: 15px 5%;
}

.brand {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--text-main);
}

.menu-links {
  display: flex;
  align-items: center;
  gap: 32px;
}

.menu a {
  text-decoration: none;
  color: var(--text-main);
  font-size: 15px;
  font-weight: 500;
  transition: color 0.2s ease;
}

.menu a:hover {
  color: var(--primary);
}

.btn-menu {
  background: var(--primary);
  color: var(--white) !important;
  padding: 10px 24px;
  border-radius: 50px;
  transition: background 0.3s ease, transform 0.2s ease;
}

.btn-menu:hover {
  background: var(--primary-hover);
  transform: translateY(-2px);
}

.hamb {
  display: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--text-main);
}
