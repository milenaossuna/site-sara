<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Psicóloga Sara Souza</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Poppins', sans-serif;
}

body {
background: #f7f7f7;
color: #333;
}

.container {
max-width: 1100px;
margin: auto;
padding: 40px 20px;
display: flex;
align-items: center;
justify-content: space-between;
flex-wrap: wrap;
}

.text {
max-width: 520px;
}

.text h1 {
font-size: 32px;
margin-bottom: 10px;
}

.text h2 {
font-size: 18px;
font-weight: 400;
color: #777;
margin-bottom: 20px;
}

.text p {
margin-bottom: 20px;
line-height: 1.6;
}

.buttons {
display: flex;
gap: 10px;
flex-wrap: wrap;
}

.btn {
padding: 12px 18px;
border-radius: 8px;
text-decoration: none;
font-size: 14px;
transition: 0.3s;
}

.btn-primary {
background: #4CAF50;
color: white;
}

.btn-outline {
border: 1px solid #ccc;
color: #333;
}

.image img {
width: 340px;
height: 380px;
object-fit: cover;
border-radius: 14px;
box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

/* WhatsApp flutuante */
.whatsapp {
position: fixed;
bottom: 20px;
right: 20px;
background: #25D366;
color: white;
padding: 14px 16px;
border-radius: 50%;
font-size: 22px;
text-decoration: none;
}

@media(max-width: 768px){
.container {
flex-direction: column;
text-align: center;
}

.image {
margin-top: 20px;
}
}
</style>

</head>

<body>

<div class="container">

<div class="text">
<h1>Sara Souza</h1>
<h2>Psicóloga | TCC para adultos</h2>

<p>
Atendimento acolhedor com base na Terapia Cognitivo-Comportamental (TCC),
promovendo equilíbrio emocional e qualidade de vida.
</p>

<div class="buttons">
<a href="#" class="btn btn-primary">Agendar pelo WhatsApp</a>
<a href="#" class="btn btn-outline">Agendamento online</a>
<a href="#" class="btn btn-outline">Instagram</a>
<a href="#" class="btn btn-outline">LinkedIn</a>
</div>

<p style="margin-top:20px; font-size:14px; color:#777;">
CRP: 06/220759
</p>

</div>

<div class="image">
<img src="https://images.unsplash.com/photo-1584515933487-779824d29309?q=80&w=800&auto=format&fit=crop" alt="Psicóloga">
</div>

</div>

<a href="#" class="whatsapp">💬</a>

</body>
</html>
