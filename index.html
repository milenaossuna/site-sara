<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Poppins', sans-serif;
}

body {
background: #f5f6f7;
color: #2d2d2d;
}

.container {
max-width: 1100px;
margin: auto;
padding: 60px 20px;
display: flex;
align-items: center;
justify-content: space-between;
flex-wrap: wrap;
gap: 40px;
}

.text {
max-width: 520px;
animation: fadeUp 0.8s ease;
}

.text h1 {
font-size: 34px;
margin-bottom: 10px;
}

.text h2 {
font-size: 18px;
font-weight: 400;
color: #6b6b6b;
margin-bottom: 20px;
}

.text p {
margin-bottom: 22px;
line-height: 1.6;
}

.buttons {
display: flex;
gap: 12px;
flex-wrap: wrap;
}

.btn {
padding: 12px 20px;
border-radius: 10px;
text-decoration: none;
font-size: 14px;
transition: all 0.25s ease;
}

.btn-primary {
background: #5f7d6b;
color: white;
}

.btn-primary:hover {
background: #4e695a;
transform: translateY(-2px);
}

.btn-outline {
border: 1px solid #cfcfcf;
color: #333;
background: white;
}

.btn-outline:hover {
background: #f0f0f0;
transform: translateY(-2px);
}

.image {
animation: fadeUp 1s ease;
}

.image img {
width: 360px;
height: 400px;
object-fit: cover;
border-radius: 16px;
box-shadow: 0 15px 40px rgba(0,0,0,0.08);
}

/* WhatsApp */
.whatsapp {
position: fixed;
bottom: 20px;
right: 20px;
background: #25D366;
color: white;
padding: 14px 16px;
border-radius: 50%;
font-size: 22px;
text-decoration: none;
box-shadow: 0 6px 15px rgba(0,0,0,0.2);
transition: 0.3s;
}

.whatsapp:hover {
transform: scale(1.1);
}

/* animação */
@keyframes fadeUp {
from {
opacity: 0;
transform: translateY(20px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

/* responsivo */
@media(max-width: 768px){
.container {
flex-direction: column;
text-align: center;
}

.image img {
width: 100%;
height: 320px;
}
}
</style>

</head>
