<style>
/* PALETA AZUL SERENO / NEO-BRUTALISTA */
:root {
  --bg-color: #F0F4F8;     /* Fundo 'gelo' muito suave */
  --text-main: #14213d;    /* Azul marinho noturno */
  --text-light: #4A5A75;   /* Azul acinzentado para textos de apoio */
  --border-color: #CDD7E0; /* Linhas num tom frio elegante */
  --white: #FFFFFF;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Manrope', sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  font-weight: 400;
}

html {
  scroll-behavior: smooth;
}

/* SCROLL REVEAL */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
}
.reveal.active {
  opacity: 1;
  transform: translateY(0);
}

/* RÓTULOS ESTILO ESTÚDIO: ( LABEL ) */
.label {
  display: block;
  font-family: 'Manrope', sans-serif;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-light);
  margin-bottom: 40px;
}

/* MENU FIXO E NOME/CRP CONSTANTES */
.menu {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  z-index: 1000;
  transition: all 0.3s ease;
  background: transparent;
  border-bottom: 1px solid transparent;
}
.menu.scrolled {
  background: var(--bg-color);
  border-bottom: 1px solid var(--border-color);
}

.brand {
  display: flex;
  flex-direction: column;
}

.brand-name {
  font-family: 'Epilogue', sans-serif;
  font-size: 18px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: -0.5px;
  color: var(--text-main);
}

.brand-crp {
  font-family: 'Manrope', sans-serif;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-light);
  letter-spacing: 1px;
  margin-top: 2px;
}

.menu-links {
  display: flex;
  align-items: center;
  gap: 30px;
}

.menu a {
  text-decoration: none;
  color: var(--text-main);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: opacity 0.2s ease;
}

.menu a:hover {
  opacity: 0.6;
}

.btn-menu {
  background: var(--text-main);
  color: var(--bg-color) !important;
  padding: 12px 24px;
  border: 1px solid var(--text-main);
  transition: all 0.3s ease;
}

.btn-menu:hover {
  background: transparent;
  color: var(--text-main) !important;
}

.hamb {
  display: none;
  font-size: 24px;
  cursor: pointer;
}

/* HEADER / HERO */
header {
  padding: 200px 40px 120px;
  text-align: center;
  border-bottom: 1px solid var(--border-color);
}

h1 {
  font-family: 'Epilogue', sans-serif;
  font-size: 7vw;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: -0.03em;
  line-height: 1;
  margin-bottom: 20px;
  color: var(--text-main);
}

.crp-badge {
  display: inline-block;
  font-family: 'Manrope', sans-serif;
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 40px;
}

.sub {
  font-size: 18px;
  color: var(--text-light);
  max-width: 650px;
  margin: 0 auto;
  font-weight: 400;
}

/* BOTAO COM MICRO-INTERAÇÃO DE SETA */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 50px;
  padding: 20px 40px;
  background: var(--text-main);
  color: var(--bg-color);
  text-decoration: none;
  font-weight: 600;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
  border: 1px solid var(--text-main);
  transition: all 0.3s ease;
}

.btn svg {
  transition: transform 0.3s ease;
}

.btn:hover {
  background: transparent;
  color: var(--text-main);
}

.btn:hover svg {
  transform: translateX(6px);
}

/* ESTRUTURA GLOBAL DAS SEÇÕES */
section {
  padding: 100px 40px;
  border-bottom: 1px solid var(--border-color);
}

/* LAYOUT Z (SOBRE MIM) COM IMAGEM SEMPRE COLORIDA */
.sobre-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border: 1px solid var(--border-color);
}

.sobre-imagem {
  border-right: 1px solid var(--border-color);
  overflow: hidden;
}

.sobre-imagem img {
  width: 100%;
  height: 100%;
  min-height: 600px;
  object-fit: cover;
  display: block;
  filter: none; /* Imagem sempre colorida */
  transform: scale(1);
  transition: transform 0.8s ease; /* Apenas zoom suave */
}

.sobre-imagem img:hover {
  transform: scale(1.03); /* Leve zoom in */
}

.sobre-texto {
  padding: 60px;
  background-color: var(--white);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.sobre-texto h2 {
  font-family: 'Epilogue', sans-serif;
  font-size: 32px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: -1px;
  margin-bottom: 40px;
}

.sobre-texto p {
  color: var(--text-light);
  font-size: 16px;
  margin-bottom: 24px;
  line-height: 1.7;
}

/* GRID DE SERVIÇOS E CARDS ARREDONDADOS */
.cards-wrapper {
  max-width: 1200px;
  margin: 0 auto;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px; /* Gap para separar os cards arredondados */
}

.card {
  background: var(--white);
  padding: 50px 40px;
  border-radius: 12px; /* Bordas arredondadas nos cards */
  box-shadow: 0 4px 20px rgba(20, 33, 61, 0.03); /* Sombra sutil azul marinho */
  text-align: center;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  border: 1px solid rgba(20, 33, 61, 0.02);
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(20, 33, 61, 0.08);
}

.card h3 {
  font-family: 'Epilogue', sans-serif;
  font-size: 20px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: -0.5px;
  margin-bottom: 20px;
}

.card p {
  color: var(--text-light);
  font-size: 15px;
}

/* A JORNADA (PASSO A PASSO EDITORIAL) */
.jornada-container {
  max-width: 1200px;
  margin: 0 auto;
}

.passos-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--border-color);
