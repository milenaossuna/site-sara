<style>
:root {
  --bg-color: #FAFAFA;
  --bg-header: #F1F4F2;
  --bg-footer: #EAEFEA;
  --text-main: #2A2C2B;
  --text-light: #5A605D;
  --primary: #4A6E58;
  --primary-hover: #3A5645;
  --white: #FFFFFF;
  --whatsapp: #25D366;
  --accent: #E2E8E4;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

html {
  scroll-behavior: smooth;
}

/* SCROLL REVEAL */
.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
}

.reveal.active {
  opacity: 1;
  transform: translateY(0);
}

/* MENU */
.menu {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 5%;
  z-index: 1000;
  transition: all 0.3s ease;
  background: transparent;
}

.menu.scrolled {
  background: var(--white);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
  padding: 15px 5%;
}

.brand {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--text-main);
}

.menu-links {
  display: flex;
  align-items: center;
  gap: 32px;
}

.menu a {
  text-decoration: none;
  color: var(--text-main);
  font-size: 15px;
  font-weight: 500;
  transition: color 0.2s ease;
}

.menu a:hover {
  color: var(--primary);
}

.btn-menu {
  background: var(--primary);
  color: var(--white) !important;
  padding: 10px 24px;
  border-radius: 50px;
  transition: background 0.3s ease, transform 0.2s ease;
}

.btn-menu:hover {
  background: var(--primary-hover);
  transform: translateY(-2px);
}

.hamb {
  display: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--text-main);
}

/* HEADER E SELO CRP */
header {
  padding: 160px 20px 100px;
  text-align: center;
  background: var(--bg-header);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.foto-wrapper {
  position: relative;
  margin-bottom: 30px;
}

.foto {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid var(--white);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 44px;
  font-weight: 600;
  margin-bottom: 10px;
  color: var(--text-main);
}

.crp-badge {
  display: inline-block;
  background: rgba(74, 110, 88, 0.1);
  color: var(--primary);
  padding: 6px 16px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 24px;
  letter-spacing: 0.5px;
}

.sub {
  font-size: 18px;
  color: var(--text-light);
  max-width: 600px;
  margin: 0 auto;
  font-weight: 300;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 40px;
  padding: 16px 36px;
  background: var(--primary);
  color: var(--white);
  border-radius: 50px;
  text-decoration: none;
  font-weight: 500;
  font-size: 16px;
  box-shadow: 0 8px 20px rgba(74, 110, 88, 0.2);
  transition: all 0.3s ease;
}

.btn:hover {
  background: var(--primary-hover);
  transform: translateY(-3px);
  box-shadow: 0 12px 24px rgba(74, 110, 88, 0.3);
}

/* SEÇÕES */
section {
  padding: 100px 5%;
  max-width: 1100px;
  margin: auto;
}

h2 {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  margin-bottom: 40px;
  color: var(--text-main);
  text-align: center;
}

.texto-centralizado {
  text-align: center;
  max-width: 750px;
  margin: 0 auto 20px;
  color: var(--text-light);
  font-size: 17px;
}

/* CARDS */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 30px;
  margin-top: 40px;
}

.card {
  background: var(--white);
  padding: 40px 30px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  text-align: center;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  border: 1px solid rgba(0,0,0,0.02);
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.card h3 {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  margin-bottom: 15px;
  color: var(--text-main);
}

.card p {
  color: var(--text-light);
  font-size: 15px;
}
